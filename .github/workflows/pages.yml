name: Pages

# Publishes the in-browser build (ADR 007) at https://sukima-labs.github.io/descargo/ on
# every push to main. GitHub Pages cannot send the Content-Security-Policy as a header; the
# page's <meta> policy covers the worker too because the worker starts from a blob: URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags; pin the exact release.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build
        run: uv run --locked python scripts/build_web.py
      - name: Smoke test in Pyodide (Node)
        run: node tests/web/smoke.mjs build/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
