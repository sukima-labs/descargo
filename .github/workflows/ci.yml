name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Students use all three; keep the matrix small while the repo is private.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags; pin the exact release.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests scripts
      - name: Pytest
        run: uv run pytest

  web:
    # The static in-browser build (ADR 007): download Pyodide and the wheels (each checked
    # against a pinned SHA-256), build the site, and run DraftWitness inside that Pyodide.
    name: in-browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build
        run: uv run --locked python scripts/build_web.py
      - name: Smoke test in Pyodide (Node)
        run: node tests/web/smoke.mjs build/web
