[project]
name = "draftwitness"
version = "0.1.0.dev0"
description = "Local-first evidence toolkit for students facing plagiarism and AI-detector false positives."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "DraftWitness contributors" }]
keywords = ["academic-integrity", "plagiarism", "ai-detection", "false-positive", "students", "gdpr", "ferpa"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
# Runtime dependencies must also run under Pyodide (see docs/adr/003-stack.md):
# pure Python, or packages that Pyodide ships prebuilt.
dependencies = [
    "typer>=0.15",
]

[project.scripts]
draftwitness = "draftwitness.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftwitness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "profiles", "jurisdictions", "schemas", "docs", "LICENSE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "PL", "C4", "PTH", "TRY", "ANN",
]
ignore = [
    "PLR2004", # magic values are fine in tests and thresholds tables
    "TRY003",  # long messages in exceptions are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["draftwitness"]
warn_unreachable = true

[tool.pytest.ini_options]
# --disable-socket enforces principle 1 (no network) across the whole suite.
addopts = "-ra --strict-markers --disable-socket --cov=draftwitness --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["src/draftwitness/__main__.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
