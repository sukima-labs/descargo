about_lead = "Una herramienta gratuita y de código abierto para estudiantes a quienes un detector de plagio o de IA (Turnitin, Compilatio…) les ha marcado un trabajo propio. Te ayuda a entender el informe y a reunir pruebas de que el trabajo es tuyo. No reescribe tu texto ni intenta bajar ninguna puntuación."
