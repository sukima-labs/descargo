about_step_2 = "Si te marcan similitud o IA: sube el PDF del informe y, si quieres, tu trabajo. Descargo recalcula el porcentaje de similitud sin las citas con su referencia, la bibliografía ni las plantillas, explica cada descuento y muestra el resultado de IA del informe y los pasajes que marca tal como los da la herramienta."
