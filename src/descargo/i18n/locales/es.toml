detail_opened_without_password = "Se abre sin contraseña: {value}"
detail_field_types = "Tipos: {value}"
kind_format_characters = "Caracteres de formato invisibles y de anchura cero"
why_format_characters = "Estos caracteres no ocupan espacio en la página. Suelen llegar con texto copiado de páginas web, PDF, herramientas de chat u otros documentos, y algunas escrituras los usan con normalidad. Algunas herramientas y algunas personas los toman como señal de que el texto se alteró para evitar coincidencias. Su presencia no demuestra quién escribió el texto."
kind_joiners = "Unión y no unión de anchura cero"
why_joiners = "Normales en persa, árabe, escrituras índicas y secuencias de emoji, donde controlan cómo se unen letras o símbolos. Dentro de palabras en alfabeto latino son raros y suelen venir de texto copiado."
kind_soft_hyphens = "Guiones opcionales"
why_soft_hyphens = "Guiones que marcan dónde puede partirse una palabra al final de una línea. Los insertan los procesadores de texto y las herramientas de división silábica; solo se ven cuando la palabra se parte."
kind_bidi_controls = "Marcas y controles de dirección del texto"
why_bidi_controls = "Fijan la dirección de lectura cuando se mezcla texto de izquierda a derecha y de derecha a izquierda (por ejemplo árabe o hebreo dentro de un texto en español o inglés). Son normales en ese tipo de texto; en otros casos suelen venir de texto copiado."
kind_bidi_overrides = "Forzados de dirección del texto"
why_bidi_overrides = "Obligan a mostrar los caracteres en un orden distinto del orden en que están guardados, así que lo que se ve y lo que lee una herramienta pueden no coincidir. Son raros en la escritura corriente."
kind_bidi_unbalanced = "Controles de dirección desequilibrados"
why_bidi_unbalanced = "Dentro de un párrafo se abre un control de dirección y no se cierra, o se cierra sin haberse abierto. Esto puede hacer que el orden mostrado no coincida con el guardado (el problema «Trojan Source», CVE-2021-42574). También puede ocurrir al editar texto que contenía esos controles."
kind_tag_characters = "Caracteres de etiqueta"
why_tag_characters = "Caracteres invisibles que deletrean texto ASCII. Salvo en banderas emoji, casi no tienen usos corrientes, y se han usado para ocultar instrucciones o mensajes en un texto. Se muestra el texto decodificado para que veas qué dicen."
kind_emoji_tag_flags = "Banderas emoji formadas con caracteres de etiqueta"
why_emoji_tag_flags = "Banderas como las de Inglaterra, Escocia y Gales se escriben como una bandera negra seguida de caracteres de etiqueta. Es su uso normal."
kind_variation_selectors = "Selectores de variación"
why_variation_selectors = "Un selector de variación aislado detrás de un carácter elige cómo se dibuja, por ejemplo como emoji en lugar de símbolo simple, o una variante de un carácter chino, japonés o coreano. Es normal."
kind_hidden_data = "Datos ocultos en selectores de variación"
why_hidden_data = "Las series de selectores de variación no tienen usos corrientes; cada uno puede llevar un byte de datos ocultos. Algún software los usa para incrustar marcas de agua u otra información en el texto. Descargo muestra cuántos datos hay y, si son texto legible, qué dicen."
kind_c2pa_manifest = "Credenciales de contenido (manifiesto C2PA)"
why_c2pa_manifest = "El texto lleva un manifiesto C2PA: una declaración sobre el origen del texto, normalmente añadida por el software que lo generó o lo editó, codificada en caracteres invisibles. Descargo informa de su presencia y su tamaño; esta versión no lee ni verifica lo que afirma. Si tu texto procede de una fuente que añade estos manifiestos, pueden aplicarse las normas de tu institución sobre declarar esa fuente."
kind_control_characters = "Caracteres de control"
why_control_characters = "Caracteres pensados para terminales e impresoras antiguos, distintos del tabulador y el salto de línea. Suelen venir de conversiones entre formatos o de texto copiado, y no tienen forma visible."
kind_private_use = "Caracteres de uso privado"
why_private_use = "Posiciones que Unicode deja a cada fuente o programa. Las fuentes de símbolos (Wingdings, Symbol) y algunos iconos las usan, así que aparecen a menudo en documentos de Word. Sin la misma fuente se ven como cuadrados."
kind_unassigned = "Posiciones sin asignar"
why_unassigned = "Posiciones sin ningún carácter asignado en la versión de Unicode usada aquí, o reservadas como no caracteres. Pueden venir de versiones más recientes de Unicode, de archivos dañados o de una manipulación deliberada."
kind_unusual_spaces = "Espacios poco habituales"
why_unusual_spaces = "Espacios distintos del corriente (espacio de n, de m, fino, ideográfico…). Los usan los programas de maquetación y algunas fuentes, y llegan con texto copiado. Sustituir los espacios corrientes por estos también es una forma conocida de disimular texto copiado, así que algunas herramientas los buscan."
kind_no_break_spaces = "Espacios de no separación"
why_no_break_spaces = "Espacios que mantienen dos palabras en la misma línea. Los procesadores de texto los insertan solos, por ejemplo antes de «%» o dentro de cifras en la tipografía española y francesa. Son corrientes y normales."
kind_blank_fillers = "Caracteres que parecen vacíos"
why_blank_fillers = "Letras o símbolos que se dibujan como espacio vacío (rellenos del hangul, el patrón Braille en blanco). Se han usado para ocultar texto o simular espacios."
kind_line_separators = "Separadores Unicode de línea y de párrafo"
why_line_separators = "Separadores que algunos programas (código JavaScript, algunos PDF) usan en lugar de los saltos de línea corrientes. Suelen ser inofensivos; algunos editores no los muestran."
kind_mixed_script_words = "Palabras que mezclan alfabetos"
why_mixed_script_words = "Palabras que mezclan letras latinas con letras cirílicas o griegas que se parecen a las latinas (por ejemplo una «а» cirílica dentro de una palabra en español). Sustituir letras así es una forma conocida de disimular texto copiado, así que algunas herramientas lo buscan. También ocurre al cambiar el teclado de idioma. Las letras del otro alfabeto se muestran como [U+XXXX]."
kind_byte_order_mark = "Marca de orden de bytes al principio del archivo"
why_byte_order_mark = "Una marca invisible que los programas de Windows suelen escribir al principio de los archivos de texto UTF-8. Es normal."
kind_rsids = "Identificadores de sesión de guardado (RSID)"
why_rsids = "Microsoft Word registra un identificador por cada sesión de edición que se guarda, y marca el texto con la sesión que lo añadió. Hay docentes que interpretan un recuento bajo, o que casi todo el texto venga de una sola sesión, como señal de haber pegado el texto. Estos identificadores no demuestran cómo se escribió el texto: otros editores (Google Docs, LibreOffice, Pages) pueden no escribir ninguno o muy pocos; escribir en otro sitio y pegar tu propio texto en un archivo nuevo, o guardarlo con otro nombre, vuelve a empezar la cuenta; y las sesiones largas sin guardar producen pocos. Un registro del proceso de escritura es una prueba más sólida que este recuento."
kind_editing_time = "Tiempo de edición registrado por el editor"
why_editing_time = "Un contador del tiempo dedicado a editar el archivo, que lleva el programa de edición. Solo cuenta el tiempo en editores que lo mantienen, vuelve a empezar en un archivo nuevo (por ejemplo al pegar el texto en un documento nuevo) y no es una medida fiable de cuánto llevó el trabajo."
kind_editing_cycles = "Ciclos de edición"
why_editing_cycles = "El número de veces que se ha guardado el archivo, según LibreOffice y otros editores ODF. Vuelve a empezar en un archivo nuevo y no demuestra cómo se escribió el texto."
kind_tracked_changes = "Control de cambios"
why_tracked_changes = "El archivo todavía contiene revisiones del control de cambios: texto anterior o eliminado, y los nombres y fechas registrados en cada cambio. Cualquiera que reciba el archivo puede mostrarlos, aunque en tu pantalla estén ocultos."
kind_comments = "Comentarios"
why_comments = "Los comentarios siguen en el archivo, con los nombres registrados en ellos, aunque en tu pantalla estén ocultos."
kind_hidden_text = "Texto oculto"
why_hidden_text = "El texto con formato oculto se guarda en el archivo pero no se muestra ni se imprime, salvo que el lector active el texto oculto. Las herramientas que extraen texto, incluidos los detectores, pueden leerlo igualmente. Las plantillas y algunos complementos usan texto oculto para dar instrucciones."
kind_white_text = "Texto blanco"
why_white_text = "Texto de color blanco, invisible sobre una página blanca pero que leen las herramientas que extraen texto. Puede ser inofensivo (texto sobre fondo oscuro, restos de una plantilla) o usarse para ocultar palabras."
kind_tiny_text = "Texto muy pequeño"
why_tiny_text = "Texto de menos de 2 puntos, difícil o imposible de ver pero que leen las herramientas que extraen texto."
kind_fields = "Campos"
why_fields = "Los campos son contenido que calcula el procesador de texto: números de página, índices, referencias cruzadas, hipervínculos y citas insertadas por gestores de referencias como Zotero, Mendeley o EndNote (aparecen como campos ADDIN). Los campos de los gestores de referencias pueden ayudar a mostrar cómo construiste tus referencias."
kind_alt_chunks = "Partes de contenido importado (altChunk)"
why_alt_chunks = "Contenido importado de otro archivo (HTML, RTF u otro documento) y guardado como una parte aparte, que Word fusiona al abrir el archivo. Suelen producirlo las herramientas de conversión y las exportaciones desde la web."
kind_embedded_objects = "Objetos incrustados"
why_embedded_objects = "Otros archivos guardados dentro de este, como hojas de cálculo, gráficos o ecuaciones. Cualquiera que reciba el archivo puede abrirlos."
kind_macros = "Macros"
why_macros = "El archivo contiene código de programa (macros). Algunos sistemas de entrega y filtros de correo rechazan o advierten de los archivos con macros."
kind_attached_template = "Plantilla adjunta"
why_attached_template = "El archivo indica la plantilla a partir de la cual se creó. La ruta puede revelar nombres de carpetas o de usuarios del ordenador donde se adjuntó la plantilla."
kind_incremental_updates = "Actualizaciones incrementales"
why_incremental_updates = "Cada vez que un PDF se edita, se firma o se rellena sin reescribirlo, los cambios se añaden al final del archivo y la versión anterior se queda dentro. Cualquiera que reciba el archivo puede a menudo recuperar las versiones anteriores."
kind_encrypted = "Cifrado"
why_encrypted = "El PDF está cifrado. Algunos sistemas de entrega y algunos detectores pueden no ser capaces de leer el texto de un PDF cifrado."
kind_attachments = "Archivos adjuntos"
why_attachments = "Los archivos adjuntos al PDF viajan con él, y cualquiera que reciba el PDF puede abrirlos."
kind_invisible_text = "Texto invisible"
why_invisible_text = "Texto dibujado en modo invisible: no se ve, pero lo leen la extracción de texto, la búsqueda y los detectores. Los documentos escaneados con reconocimiento de texto (OCR) suelen tener una capa así sobre la imagen de la página. pypdf extrae el texto por fragmentos, así que puede incluirse texto contiguo al invisible."

