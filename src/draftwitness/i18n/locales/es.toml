how_approximate = "Una fuente descontada entera resta su porcentaje del informe. Un pasaje descontado resta sus palabras divididas entre {words} (el recuento del informe o el de tu documento), con el porcentaje de su fuente como máximo. Se supone que cada pasaje se atribuye a una sola fuente, como en la vista por defecto de Turnitin, así que los solapamientos lo convierten en una estimación. En caso de duda, DraftWitness descuenta menos, nunca más."
