[audit]
title = "Similarity audit"
intro = "**Note for you.** DraftWitness is not legal advice. It does not decide whether anything is or is not plagiarism: it applies the rules listed at the end to the detector's report and shows what it found, so that you, and anyone you show this to, can check each point. Discounts based on your declarations rest on your own statement."
