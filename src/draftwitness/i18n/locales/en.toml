kind_format_characters = "Zero-width and other invisible format characters"
why_format_characters = "These characters take no space on the page. They often arrive with text copied from web pages, PDFs, chat tools or other documents, and some scripts use them normally. Some tools and readers treat them as a sign that text was altered to avoid matching. Their presence does not show who wrote the text."
kind_joiners = "Zero-width joiners and non-joiners"
why_joiners = "Normal in Persian, Arabic, Indic scripts and emoji sequences, where they control how letters or symbols join. Inside words in Latin script they are unusual and usually come from copied text."
kind_soft_hyphens = "Soft hyphens"
why_soft_hyphens = "Optional hyphens that mark where a word may break at the end of a line. Word processors and hyphenation tools insert them; they are visible only when the word breaks."
kind_bidi_controls = "Text-direction marks and controls"
why_bidi_controls = "They set the reading direction of mixed left-to-right and right-to-left text (for example Arabic or Hebrew inside Spanish or English). Normal in such text; elsewhere they usually come from copied text."
kind_bidi_overrides = "Text-direction overrides"
why_bidi_overrides = "These force characters to be displayed in an order different from the order in which they are stored, so what is shown and what a tool reads can differ. They are rare in ordinary writing."
kind_bidi_unbalanced = "Unbalanced text-direction controls"
why_bidi_unbalanced = "A direction control is opened and not closed, or closed without being opened, within a paragraph. This can make the displayed order differ from the stored order (the “Trojan Source” problem, CVE-2021-42574). It can also result from editing text that contained such controls."
kind_tag_characters = "Tag characters"
why_tag_characters = "Invisible characters that spell out ASCII text. Apart from emoji flags, they have almost no ordinary use, and they have been used to hide instructions or messages in text. The decoded text is shown so you can see what they say."
kind_emoji_tag_flags = "Emoji flags built from tag characters"
why_emoji_tag_flags = "Flags such as those of England, Scotland and Wales are written as a black flag followed by tag characters. This is their normal use."
kind_variation_selectors = "Variation selectors"
why_variation_selectors = "A single variation selector after a character chooses how it is drawn, for example an emoji instead of a plain symbol, or a variant of a CJK character. This is normal."
kind_hidden_data = "Data hidden in variation selectors"
why_hidden_data = "Runs of variation selectors have no ordinary use; each one can carry a byte of hidden data. Some software uses them to embed watermarks or other information in text. DraftWitness shows how much data there is and, if it is readable text, what it says."
kind_c2pa_manifest = "Content credentials (C2PA manifest)"
why_c2pa_manifest = "The text carries a C2PA manifest: a statement about the text's origin, usually added by the software that generated or edited it, encoded in invisible characters. DraftWitness reports its presence and size; this version does not read or verify what it claims. If your text comes from a source that adds such manifests, your institution's rules on disclosing that source may apply."
kind_control_characters = "Control characters"
why_control_characters = "Characters for old terminals and printers, other than tab and line break. They usually come from conversions between formats or from copied text, and have no visible form."
kind_private_use = "Private-use characters"
why_private_use = "Code points that Unicode leaves to each font or program. Symbol fonts (Wingdings, Symbol) and some icons use them, so they often appear in Word documents. Without the same font they display as boxes."
kind_unassigned = "Unassigned code points"
why_unassigned = "Code points with no character assigned in the Unicode version used here, or reserved as non-characters. They can come from newer Unicode versions, damaged files or deliberate tampering."
kind_unusual_spaces = "Unusual spaces"
why_unusual_spaces = "Spaces other than the ordinary one (en, em, thin, ideographic spaces…). Typesetting software and some fonts use them, and they arrive with copied text. Replacing ordinary spaces with them is also a known way of disguising copied text, so some tools look for them."
kind_no_break_spaces = "Non-breaking spaces"
why_no_break_spaces = "Spaces that keep two words on the same line. Word processors insert them automatically, for example before “%” or inside numbers in Spanish and French typography. They are common and normal."
kind_blank_fillers = "Characters that look blank"
why_blank_fillers = "Letters or symbols that are drawn as empty space (Hangul fillers, the blank Braille pattern). They have been used to hide text or fake spaces."
kind_line_separators = "Unicode line and paragraph separators"
why_line_separators = "Separators that some programs (JavaScript code, some PDFs) use instead of ordinary line breaks. Usually harmless; some editors display them as nothing."
kind_mixed_script_words = "Words mixing alphabets"
why_mixed_script_words = "Words that mix Latin with Cyrillic or Greek letters that look like Latin ones (for example a Cyrillic “а” inside an English word). Replacing letters this way is a known way of disguising copied text, so some tools look for it. It also happens with keyboards switched between languages. The letters from the other alphabet are shown as [U+XXXX]."
kind_byte_order_mark = "Byte-order mark at the start of the file"
why_byte_order_mark = "An invisible marker that Windows programs often write at the start of UTF-8 text files. It is normal."
kind_rsids = "Save-session identifiers (RSIDs)"
why_rsids = "Microsoft Word records an identifier for each editing session that is saved, and labels text with the session that added it. Some instructors read a low count, or most of the text coming from one session, as a sign of pasting. These identifiers do not show how the text was written: other editors (Google Docs, LibreOffice, Pages) may write none or few; writing elsewhere and pasting your own text into a new file, or saving under a new name, starts again; and long sessions without saving produce few. A writing-process record is stronger evidence than this count."
kind_editing_time = "Editing time recorded by the editor"
why_editing_time = "A counter of time spent editing the file, kept by the editing software. It counts only time in editors that maintain it, starts again in a new file (for example when text is pasted into a new document) and is not a reliable measure of how long the work took."
kind_editing_cycles = "Editing cycles"
why_editing_cycles = "The number of times the file has been saved, as counted by LibreOffice and other ODF editors. It starts again in a new file and does not show how the text was written."
kind_tracked_changes = "Tracked changes"
why_tracked_changes = "The file still contains revisions with tracked changes: earlier or deleted text, and the names and dates recorded for each change. Anyone who receives the file can display them, even if they are hidden on your screen."
kind_comments = "Comments"
why_comments = "Comments stay in the file, with the names recorded for them, even if comments are hidden on your screen."
kind_hidden_text = "Hidden text"
why_hidden_text = "Text formatted as hidden is stored in the file but not shown or printed, unless the reader turns on hidden text. Text extraction tools, including detectors, may still read it. Templates and some add-ins use hidden text for instructions."
kind_white_text = "White text"
why_white_text = "Text coloured white, which is invisible on a white page but still read by tools that extract text. It can be harmless (text on a dark background, leftovers from a template) or used to hide words."
kind_tiny_text = "Very small text"
why_tiny_text = "Text smaller than 2 points, hard or impossible to see but still read by tools that extract text."
kind_fields = "Fields"
why_fields = "Fields are content computed by the word processor: page numbers, tables of contents, cross-references, hyperlinks, and citations inserted by reference managers such as Zotero, Mendeley or EndNote (shown as ADDIN fields). Citation-manager fields can help show how you built your references."
kind_alt_chunks = "Imported content parts (altChunk)"
why_alt_chunks = "Content imported from another file (HTML, RTF or another document) and stored as a separate part, which Word merges when the file is opened. It is often produced by conversion tools and web exports."
kind_embedded_objects = "Embedded objects"
why_embedded_objects = "Other files stored inside this one, such as spreadsheets, charts or equations. Anyone who receives the file can open them."
kind_macros = "Macros"
why_macros = "The file contains program code (macros). Some submission systems and mail filters reject or warn about files with macros."
kind_attached_template = "Attached template"
why_attached_template = "The file names the template it was created from. The path can reveal folder or user names on the computer where the template was attached."
kind_incremental_updates = "Incremental updates"
why_incremental_updates = "Each time a PDF is edited, signed or filled in without being rewritten, the changes are appended to the end of the file and the earlier version stays inside it. Earlier versions can often be recovered by anyone who receives the file."
kind_encrypted = "Encryption"
why_encrypted = "The PDF is encrypted. Some submission systems and detectors may be unable to read the text of an encrypted PDF."
kind_attachments = "Attached files"
why_attachments = "Files attached to the PDF travel with it, and anyone who receives the PDF can open them."
kind_invisible_text = "Invisible text"
why_invisible_text = "Text drawn in invisible mode: it is not shown but text extraction, search and detectors read it. Scanned documents with text recognition (OCR) normally have such a layer over the page image. pypdf extracts text in chunks, so text next to the invisible text may be included."

