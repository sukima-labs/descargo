footer_privacy = "Open-source software (AGPL-3.0). This page makes no requests except for its own files: no analytics, no cookies, no accounts."
build_info = "DraftWitness {version} · commit {commit} · Pyodide {pyodide}"
about_title = "What DraftWitness is"
about_lead = "A free, open-source tool for students whose own work has been flagged by a plagiarism or AI detector (Turnitin, Compilatio…). It helps you understand the report and gather evidence that the work is yours. It does not rewrite your text or try to lower any score."
about_steps_title = "How to use it"
about_step_1 = "Before you submit: check what your file contains besides the visible text (metadata, invisible characters, tracked changes, hidden text), so that nothing surprises you later."
about_step_2 = "If you are flagged for similarity: upload the report PDF and, if you like, your work. DraftWitness recomputes the percentage without quotations with their reference, the reference list or templates, explains each discount, and shows the report's AI result as the tool gives it."
about_step_3 = "If you are not shown the report: draft a letter asking for it under your country's data protection law. Nothing is sent: you review it and send it yourself."
about_more = "More: what it reads, what it does not do, and your data"
about_reads_title = "Which reports it reads today"
about_reads_1 = "Turnitin: the new Similarity Report (\"Overall Similarity\"), in English and Spanish, and the classic Feedback Studio report, in English."
about_reads_2 = "Compilatio: Magister and Magister+ analysis reports and certificates, in Spanish, with the AI percentage and the passages it flags."
about_reads_3 = "Use the PDF exactly as you downloaded it from the detector. A scan, a copy pasted into another document, or a PDF saved again from Word may not read well."
about_reads_4 = "Not yet: Turnitin's AI writing report, the classic Turnitin report in Spanish, and Copyleaks. If you have one of those, tell us under \"Send feedback\"."
about_not_title = "What it does not do"
about_not_1 = "It does not rewrite or \"humanise\" text, and does not teach how to get past a detector."
about_not_2 = "It does not predict the score a detector would give."
about_not_3 = "It does not decide whether something is plagiarism: it shows what the report says and what can be checked."
about_not_4 = "It is not legal advice."
about_privacy_title = "Your data"
about_privacy = "Everything happens inside this tab: your files are not uploaded to any server and are gone when you close it. The first visit downloads about 20 MB and can take up to a minute; later visits are faster."
about_beta = "This is a test version: it may fail or get things wrong. Always compare the results with your original report, and tell us what you find under \"Send feedback\"."
tab_feedback = "Send feedback"
feedback_intro = "Tried the page? Tell us what worked, what failed and what is missing. The message is prepared here and you see exactly what it contains; nothing is sent by itself."
feedback_privacy = "Do not attach your work or your report, and do not write personal details about yourself or anyone else."
