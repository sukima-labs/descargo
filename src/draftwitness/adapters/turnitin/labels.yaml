# Labels the Turnitin PDF adapter looks for, per report layout and language.
#
# Kept in data so that another language or a changed layout needs no code change. Each
# layout records where its labels were checked. "verified" means the label was seen in the
# text that pypdf extracts from a real downloaded report, or quoted in Turnitin's own guide;
# "needs_verification" means it is taken from a secondary source and must be confirmed.
#
# Real reports used for checking are never committed (tests/fixtures/README.md).

feedback_studio:
  # Feedback Studio "Current View" download: the paper, then an "ORIGINALITY REPORT" page.
  checked: 2026-10-27
  verification: verified
  source: >-
    pypdf text of a Turnitin report published by a journal; layout described in
    https://guides.turnitin.com/hc/en-us/articles/27881575386125
  en:
    report_heading: "ORIGINALITY REPORT"
    overall: "SIMILARITY INDEX"
    database_internet: "INTERNET SOURCES"
    database_publications: "PUBLICATIONS"
    database_student_papers: "STUDENT PAPERS"
    sources_heading: "PRIMARY SOURCES"
    source_kinds:
      "Internet Source": internet
      "Publication": publication
      "Student Paper": student_paper
    exclude_quotes: "Exclude quotes"
    exclude_bibliography: "Exclude bibliography"
    exclude_matches: "Exclude matches"
    switch_on: "On"
    switch_off: "Off"
    words: "words"
    submission_date: "Submission date:"
    submission_id: "Submission ID:"
    word_count: "Word count:"
    character_count: "Character count:"
    author_prefix: "by "
    # Lines after the source list that start the GradeMark page ("PAGE 1", "PAGE 2"…).
    page_marker: "PAGE"

enhanced:
  # The new, enhanced Similarity Report: Cover Page, Integrity Overview, Submission.
  checked: 2026-10-28
  verification: verified
  source: >-
    pypdf text of real reports: one in English of February 2025, four in Spanish of January
    and November 2025 (one full, three excerpts, one of them reprinted through Word), read on
    the maintainer's machine only; and a Turnitin report published by a journal. Sections
    described in https://guides.turnitin.com/hc/en-us/articles/27881575386125 and match
    groups in https://guides.turnitin.com/hc/en-us/articles/27395528629517
  en:
    cover_page: "Cover Page"
    integrity_overview: "Integrity Overview"
    document_details: "Document Details"
    submission_id: "Submission ID"
    submission_date: "Submission Date"
    file_name: ["File Name"]
    pages: ["Page", "Pages"]
    words: ["Word", "Words"]
    characters: ["Character", "Characters"]
    # "Page 2 of 13 - Integrity Overview"
    page_footer: ["Page"]
    page_of: ["of"]
    months: [jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec]
    overall: "Overall Similarity"
    filtered_heading: "Filtered from the Report"
    filters:
      # "Bibliography" and "Quoted Text" have been seen in real reports; the others come
      # from a secondary source and are marked in filters_needing_verification.
      "Bibliography": bibliography
      "Quoted Text": quotes
      "Cited Text": cited
      "Small Matches": small_matches
    filters_needing_verification: ["Cited Text", "Small Matches"]
    exclusions_heading: "Exclusions"
    excluded_matches: "Excluded Matches"
    excluded_sources: "Excluded Sources"
    match_groups_heading: "Match Groups"
    match_groups:
      "Not Cited or Quoted": not_cited_or_quoted
      "Missing Quotations": missing_quotations
      "Missing Citation": missing_citation
      "Cited and Quoted": cited_and_quoted
    top_sources_heading: "Top Sources"
    top_sources_intro: "The sources with the highest number of matches within the submission."
    integrity_submission: "Integrity Submission"
    databases:
      "Internet sources": internet
      "Publications": publications
      "Submitted works (Student Papers)": submitted_works
    integrity_flags_heading: "Integrity Flags"
    integrity_flags: "Integrity Flags for Review"
    no_integrity_flags: "No suspicious text manipulations found."
    integrity_flags_end: "Our system's algorithms"
    source_kinds:
      "Internet": internet
      "Publication": publication
      "Student papers": student_paper
      "Submitted works": student_paper
  es:
    cover_page: "Portada"
    integrity_overview: "Descripción general de integridad"
    document_details: "Detalles del documento"
    submission_id: "Identificador de la entrega"
    submission_date: "Fecha de entrega"
    file_name: ["Nombre de archivo", "Nombre del archivo"]
    pages: ["Página", "Páginas"]
    words: ["Palabra", "Palabras"]
    characters: ["Carácter", "Caracteres"]
    # "Página 2 of 33 - Descripción general de integridad", or "Página 2 de 78 - …"
    page_footer: ["Página"]
    page_of: ["of", "de"]
    months: [ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    overall: "Similitud general"
    filtered_heading: "Filtrado desde el informe"
    filters:
      "Bibliografía": bibliography
    filters_needing_verification: []
    exclusions_heading: "Exclusiones"
    # The Spanish reports print "N.º de coincidencias excluidas", without the number.
    excluded_matches: "coincidencias excluidas"
    excluded_sources: "fuentes excluidas"
    match_groups_heading: "Grupos de coincidencias"
    match_groups: {}
    top_sources_heading: "Fuentes principales"
    top_sources_intro: >-
      Las fuentes con el mayor número de coincidencias dentro de la entrega.
    integrity_submission: "Integrity Submission"
    databases:
      "Fuentes de Internet": internet
      "Publicaciones": publications
      "Trabajos entregados (trabajos del estudiante)": submitted_works
    integrity_flags_heading: "Marcas de integridad"
    integrity_flags: "alertas de integridad para revisión"
    no_integrity_flags: "No se han detectado manipulaciones de texto sospechosas."
    integrity_flags_end: "Los algoritmos de nuestro sistema"
    source_kinds:
      "Internet": internet
      "Publicación": publication
